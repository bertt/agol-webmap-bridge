[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agol-webmap-bridge"
version = "0.1.0"
description = "Convert ArcGIS Online webmaps to GeoNode Map JSON"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
agol-webmap-bridge = "agol_webmap_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agol_webmap_bridge*"]
